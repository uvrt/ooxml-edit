[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ooxml-edit"
version = "0.68.0"
description = "Lossless, undoable editing of OOXML packages (docx, pptx, xlsx) over lxml"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Evert Koks" }]
keywords = ["ooxml", "opc", "lxml", "editing", "undo", "pptx", "docx", "xlsx", "charts", "smartart", "agent", "tools", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Office/Business :: Office Suites",
  "Topic :: Text Processing :: Markup :: XML",
]
# lxml: the standard library's xml.etree renames namespace prefixes and drops declarations
# it thinks unused, which breaks mc:Ignorable; an editor that must write back what it read
# cannot use it.  See docs/DESIGN.md, "Why lxml".  ooxml-common: the format-neutral reading
# every library shares (number format codes, the measured date names, the locale), standard
# library only and never importing this package.  Neither is on PyPI: install ooxml-common
# from its repository first (README, "Install").
dependencies = ["lxml>=4.9", "ooxml-common>=0.29.0"]

[project.optional-dependencies]
# markdown-it-py: tests only, to check ooxml_edit.markdown against the parser the format
# libraries use for whole documents (tests/test_markdown.py skips without it).  ruff and
# mypy: pinned, as the CI build job installs them, so a new release's rules never turn a
# pull request red by themselves.
dev = ["pytest>=7", "markdown-it-py>=3", "ruff==0.17.2", "mypy==2.4.0"]

[project.urls]
Repository = "https://github.com/uvrt/ooxml-edit"
Issues = "https://github.com/uvrt/ooxml-edit/issues"

[tool.setuptools.packages.find]
where = ["src"]

# py.typed: the annotations are part of the package (PEP 561), for the agents' type checks.
[tool.setuptools.package-data]
ooxml_edit = ["py.typed"]

# Bug-finding rules only, no style: pyflakes (F), syntax errors (E9), mutable or call
# defaults (B006, B008), return/break in finally (B012), a comparison used as a statement
# (B015), pylint's error class (PLE).  No formatting and no import sorting.
[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["F", "E9", "B006", "B008", "B012", "B015", "PLE"]

# Non-strict: the annotations as written are checked, unannotated functions are not.
# lxml ships no annotations (its elements are Any here; no stub package is used), and the
# siblings are typed only from their py.typed releases on, so both are ignored as missing.
[tool.mypy]
python_version = "3.10"
files = ["src/ooxml_edit"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*", "ooxml_common", "ooxml_common.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "provider: calls a model provider's API online; skipped without its API key",
]
