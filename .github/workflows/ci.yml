name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, so a sibling's change that breaks this repository shows the next morning
  # rather than at the next push here (and the downstream job below runs against the
  # agents' newest main).  The seven repositories' crons are staggered: ooxml-common
  # 02:07, ooxml-edit 02:17, pptx2svg 02:37, docx2svg 02:47, pptx-agent 03:07, docx-agent
  # 03:17, xlsx-agent 03:27 (UTC).  The whole matrix, as a push runs it.
  schedule:
    - cron: "17 2 * * *"

# One run per pull request at a time: a new push to it cancels the run for the push
# before.  A push to main, the nightly run and a manual run are never cancelled and never
# wait: their group ends in the run's own id (a group keeps one pending run and drops the
# one before it, so a shared group would drop a queued run of main).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # On a pull request macOS runs only the oldest and the newest Python (3.10 and
        # 3.15): its runners are the scarce ones, and a pull request mostly waited for
        # them.  Ubuntu and Windows still run every version there.  A push to main, the
        # nightly run and a manual run take the whole matrix.  The job names stay
        # `test (<os>, <python>)`, which branch protection matches.
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"macos-latest","python-version":"3.11"},{"os":"macos-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.13"},{"os":"macos-latest","python-version":"3.14"}]') || fromJSON('[]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15.0 is out (2026-10-09) but setup-python's version list may still offer only
          # its release candidates; this takes a final release whenever there is one, so
          # it changes nothing for 3.10 to 3.14.
          allow-prereleases: true

      - name: Install
        # ooxml-common is a dependency and not on PyPI: installed from its repository first,
        # so `pip install -e .[dev]` then finds the requirement already met.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ooxml-common @ git+https://github.com/uvrt/ooxml-common@main"
          python -m pip install -e .[dev]

      - name: Test
        run: python -m pytest -q

  # The agents' suites against this change.  ooxml-edit's tool layer, history and package
  # are what pptx-agent, docx-agent and xlsx-agent are built on, so a change that breaks
  # one of them fails here, on its own pull request, instead of at the agent's next push.
  # Each agent is its main, with this checkout installed (editable) before it so its
  # `ooxml-edit` requirement is already met, and its other siblings from their main as its
  # own CI installs them; one Linux leg on one Python, the agent's default run.  A change
  # an agent must follow is red here until the agent's matching pull request is merged
  # right after this one.
  downstream:
    name: downstream (${{ matrix.agent }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: pptx-agent
            siblings: >-
              "pptx2svg[png] @ git+https://github.com/uvrt/pptx2svg@main"
              "pptx2svg-fonts @ git+https://github.com/uvrt/pptx2svg@main#subdirectory=packages/pptx2svg-fonts"
            extras: dev,png
            pytest-args: ""
          - agent: docx-agent
            siblings: >-
              "docx2svg[png] @ git+https://github.com/uvrt/docx2svg@main"
            extras: dev,png
            pytest-args: -n auto
          - agent: xlsx-agent
            # Its test extra takes docx-agent too (since xlsx-agent 0.1.34), as its own CI
            # installs it.
            siblings: >-
              "pptx2svg @ git+https://github.com/uvrt/pptx2svg@main"
              "pptx-agent @ git+https://github.com/uvrt/pptx-agent@main"
              "docx2svg @ git+https://github.com/uvrt/docx2svg@main"
              "docx-agent @ git+https://github.com/uvrt/docx-agent@main"
            extras: test
            pytest-args: ""

    steps:
      - uses: actions/checkout@v4
        with:
          path: ooxml-edit

      - uses: actions/checkout@v4
        with:
          repository: uvrt/${{ matrix.agent }}
          ref: main
          path: ${{ matrix.agent }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ooxml-common @ git+https://github.com/uvrt/ooxml-common@main"
          python -m pip install -e ./ooxml-edit
          python -m pip install ${{ matrix.siblings }}
          python -m pip install -e "./${{ matrix.agent }}[${{ matrix.extras }}]"

      # As docx-agent's own CI installs them, so its render, reflow and field tests run.
      # The fonts come from the apt mirror once, then from the Actions cache, so a mirror
      # outage cannot turn a run red: on a miss apt installs them (with retries) and every
      # file the packages put under the font and fontconfig directories is cached with its
      # path; on a hit those files go back to the same paths and apt is not touched.
      - name: Restore the open substitute fonts from the cache (docx-agent)
        id: substitute-fonts
        if: matrix.agent == 'docx-agent'
        uses: actions/cache/restore@v4
        with:
          path: ~/substitute-fonts
          key: substitute-fonts-${{ runner.os }}-fonts-crosextra-carlito-fonts-crosextra-caladea-fonts-liberation-v1
      - name: Install the open substitute fonts (docx-agent)
        if: matrix.agent == 'docx-agent' && steps.substitute-fonts.outputs.cache-hit != 'true'
        run: |
          packages="fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation"
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=5 update &&
               sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends $packages; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
          mkdir -p ~/substitute-fonts
          dpkg -L $packages | grep -E '^/(usr/share/fonts|usr/share/fontconfig|etc/fonts)/' |
            while read -r f; do
              if [ -f "$f" ] || [ -L "$f" ]; then cp -d --parents "$f" ~/substitute-fonts/; fi
            done
      - name: Save the open substitute fonts to the cache (docx-agent)
        if: matrix.agent == 'docx-agent' && steps.substitute-fonts.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/substitute-fonts
          key: ${{ steps.substitute-fonts.outputs.cache-primary-key }}
      - name: Put the cached substitute fonts in place and check them (docx-agent)
        if: matrix.agent == 'docx-agent'
        env:
          CACHE_HIT: ${{ steps.substitute-fonts.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            sudo cp -dR ~/substitute-fonts/. /
            sudo fc-cache -f
          fi
          fc-list : family style file | grep -E 'Carlito|Caladea|Liberation' | sort
          for family in Carlito Caladea "Liberation Sans" "Liberation Serif" "Liberation Mono"; do
            fc-list "$family" family | grep -q . || { echo "missing font: $family"; exit 1; }
          done

      - name: The ooxml-edit under test is this checkout
        run: |
          python - <<'PY'
          import pathlib, sys
          import ooxml_edit
          here = pathlib.Path("ooxml-edit/src").resolve()
          path = pathlib.Path(ooxml_edit.__file__).resolve()
          print("ooxml-edit from", path)
          sys.exit(0 if here in path.parents else f"expected ooxml-edit from {here}")
          PY

      - name: Test ${{ matrix.agent }}
        working-directory: ${{ matrix.agent }}
        run: python -m pytest -q ${{ matrix.pytest-args }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyproject.toml's version, and __version__, must be the one CHANGELOG.md's top
      # version section names: the tag workflow tags that version when it reaches main.
      - name: The version agrees with CHANGELOG.md
        run: python .github/check_version.py
      # Steps of this job, not jobs of their own (the required checks are the jobs).  The
      # same pins as pyproject.toml's dev extra; its [tool.ruff] and [tool.mypy] say what
      # is checked.
      - name: Lint (ruff)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.17.2"
          ruff check .
      # mypy reads ooxml-common's annotations once it ships py.typed (ignored until then),
      # so it is installed from its repository as the test job installs it.
      - name: Type check (mypy)
        run: |
          python -m pip install "ooxml-common @ git+https://github.com/uvrt/ooxml-common@main"
          python -m pip install "mypy==2.4.0"
          mypy
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
